<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>يمينك</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- ═══ Header ═══ -->
  <header class="header">
    <div class="header-logo">
      <img src="../icons/icon-48.svg" alt="" class="logo-icon" aria-hidden="true">
      <div class="logo-text">
        <span class="logo-name">يمينك</span>
        <span class="logo-sub">إصلاح النصوص العربية</span>
      </div>
    </div>
  </header>

  <!-- ═══ Site bar ═══ -->
  <div class="site-bar">
    <span class="site-label">الموقع الحالي</span>
    <span class="site-name" id="siteName" dir="ltr">جارٍ التحميل…</span>
  </div>

  <!-- ═══ Main ═══ -->
  <main class="content" id="mainContent">

    <!-- بطاقة التبديل الرئيسية -->
    <div class="card toggle-card" id="toggleCard" role="button" tabindex="0">
      <div class="toggle-info">
        <span class="toggle-title">تفعيل إصلاح RTL</span>
        <span class="toggle-status" id="toggleStatus">معطّلة</span>
      </div>
      <label class="switch" aria-hidden="true">
        <input type="checkbox" id="rtlToggle">
        <span class="slider"></span>
      </label>
    </div>

    <!-- الاختصارات -->
    <div class="card shortcuts-card">
      <div class="shortcut-row">
        <span class="shortcut-label">تفعيل / إلغاء</span>
        <div class="keys"><kbd>Alt</kbd><span class="plus">+</span><kbd>G</kbd></div>
      </div>
      <div class="shortcut-row">
        <span class="shortcut-label">فتح يمينك</span>
        <div class="keys"><kbd>Alt</kbd><span class="plus">+</span><kbd>O</kbd></div>
      </div>
    </div>

  </main>

  <!-- ═══ Footer ═══ -->
  <footer class="footer">
    <div class="privacy-badge">
      <span>🔒</span>
      <span>لا تُجمع أي بيانات</span>
    </div>
    <div class="footer-end">
      <button class="icon-btn" id="settingsBtn" title="الإعدادات">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <span class="version">v1.0.0</span>
    </div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
